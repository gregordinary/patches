# SPDX-License-Identifier: GPL-3.0-or-later
# series/rk3576-fixes.toml
#
# RK3576 kernel-fix series: fixes a mainline 7.1 kernel needs on RK3576 boards,
# each written to upstream standards and meant to leave this repo. Referenced by
# kernels/rk3576-mainline-7.1. The list is the authoritative apply order for the
# kernel tree, applied with `git am --3way`; paths are relative to this repo's root.

# Declared intent; the builder's verify-applies gate is the enforcement.
applies_to_kernel = ">=7.1, <7.2"

# Kernel tree: the RK3576 GPU power domain is supplied by an external regulator
# (vdd_gpu_s0 on the RK806), but -- unlike the RK3588 GPU domain -- it was never
# flagged as needing one, so the pmdomain core powers the domain without first
# enabling the rail. A deferred GPU-consumer (panfrost) probe then races the
# regulator core's disable-unused pass: if the boot-on rail has been torn down,
# the domain never acks its power-up ("failed to get ack on domain 'gpu'") and
# panfrost's first register write aborts asynchronously (SError -> panic). 100
# gives the RK3576 GPU domain a regulator like RK3588's; 101 labels the domain so
# a board can attach vdd_gpu_s0 with domain-supply (the H96 board DTS does).
# Upstream-destined; retire from this series once it reaches the 7.1.y stable tree.
#
# 102 describes the CPU caches, which the SoC dtsi omits entirely -- the kernel
# reports "cacheinfo: Unable to detect cache hierarchy for CPU 0" and leaves
# /sys/devices/system/cpu/cpu*/cache empty. The sizes are the TRM's for the two
# clusters and agree with rk3399-base.dtsi, which carries the same A72 and A53
# cores. Also upstream-destined.
#
# 103 makes `rockchip,sai-tx-route` take effect at all. The SAI driver programs
# SAI_PATH_SEL once from probe, and the value does not survive to the running
# device -- the register reads its reset mapping no matter what the property says,
# so a board whose codec sits on an SDO port the reset mapping does not drive gets
# a card that streams correctly into silence. Every in-tree board describes the
# identity mapping the register already holds, so none of them can observe it.
# Re-applying the routing from runtime_resume also keeps it across PM cycles.
# Upstream-destined; this is a driver defect, not a board quirk.
#
# 104 arms the VDPU383's three reference read caches. The vendor driver
# configures, invalidates and bounds them before every decode; mainline's HEVC
# and H.264 backends issue no cache configuration at all, and cannot -- probe
# maps only the "function" and "link" reg regions, so the window those registers
# live in is never mapped, though rk3576.dtsi has described it all along. The
# caches serve reads only, so this is throughput with decoded output unchanged;
# a read_cache module parameter measures the two configurations against each
# other without a rebuild. This one is on the SoC layer's decoder, so the base
# h96-max-m9/forky image gets it too, not just media-accel. Upstream-destined
# like the rest -- offered to the mainline maintainers, not merged, so unlike
# 100-102 there is no landed commit to retire it against yet.
#
# 073 bounds the HEVC tile counts, and is shared verbatim with the RK3588 series
# (series/rk3588-accel), where its full rationale lives. num_tile_columns_minus1
# and num_tile_rows_minus1 arrive from userspace as u8 and index fixed-size
# arrays -- the backends' own stack scratch and the control's own
# column_width_minus1[20] / row_height_minus1[22] -- with no range check in the
# driver or the V4L2 core, so a hostile count writes past a 40-byte stack array.
# The fix rejects out-of-range counts in try_ctrl for all three rkvdec HEVC
# backends, and the VDPU383 is one of them: this SoC's decoder parses the same
# controls and overflows the same stack, and it is the SoC layer's decoder, so
# the base image is exposed, not just media-accel. The bound is the uAPI array
# size, which is also the HEVC maximum (20 columns, 22 rows), so no conforming
# stream is refused. It sits after 104 because both patches touch
# rkvdec-vdpu383-hevc.c -- 104 in the run path, 073 in try_ctrl -- and 073
# applies strictly (no 3-way) on top; a re-curation of the shared file for
# either series has to keep applying in the other, which the builder's
# verify-applies gate enforces. Retires when a kernel arrives carrying an
# upstream equivalent, from both series at once.
kernel = [
    "rk3576/kernel/100-pmdomain-rockchip-rk3576-gpu-regulator.patch",
    "rk3576/kernel/101-arm64-dts-rk3576-gpu-power-domain-label.patch",
    "rk3576/kernel/102-arm64-dts-rk3576-cpu-caches.patch",
    "rk3576/kernel/103-asoc-rockchip-sai-reapply-routing-on-resume.patch",
    "rk3576/kernel/104-media-rkvdec-vdpu383-read-cache.patch",
    "media-accel/kernel/073-rkvdec-hevc-bound-tile-counts.patch",
]

ffmpeg    = []
userspace = []
uboot     = []
