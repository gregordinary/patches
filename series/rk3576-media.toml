# SPDX-License-Identifier: GPL-3.0-or-later
# series/rk3576-media.toml
#
# RK3576 FFmpeg series: the patches an FFmpeg built `--enable-v4l2-request` needs
# to drive this SoC's VDPU383 correctly and to carry what it decodes.
#
# Every patch here is shared verbatim with series/rk3588-accel, where the same
# FFmpeg tree serves the RK3588. The two series take different subsets of it: this
# one omits the RKMPP hwcontext, the rkrga filters and everything built on them,
# because MPP needs the vendor mpp_service kernel framework and there is no RK3576
# MPP at all. What remains is format support and the stateless V4L2 decode path,
# neither of which touches a file the omitted patches do -- the builder's
# verify-applies gate is what holds that apart.
#
# 0001 and 0002 add NV15 and NV20 to libavutil and libswscale, and 0013 stops
# libswscale dropping the tail samples of a row in them. NV15 is 10-bit 4:2:0
# packed with no padding between samples, and it is what the VDPU383 writes for
# 10-bit content -- the hardware has no other output format for it, so a decoder
# that cannot name NV15 cannot hand a 10-bit frame to anything. 0005 tags the
# format on the v4l2request hwcontext so a decoded frame carries what it actually
# is rather than an approximation. Without the four, 10-bit decode succeeds in
# hardware and then fails at the first consumer: hwdownload cannot name the
# format, and a plain `-hwaccel v4l2request` transcode aborts with `Failed to
# transfer data to output frame`. There is no software fallback in that path,
# because the hwaccel accepted the profile before the format became a problem.
#
# 0016 sets the HEVC SPS reference-picture-set controls. This SoC's rkvdec parses
# slice headers in hardware and takes the SPS-level sets through EXT_SPS_ST_RPS
# and EXT_SPS_LT_RPS, which this kernel exposes; an FFmpeg that never populates
# them leaves the decoder to work from what the slice header alone carries. The
# RK3588's driver takes the same two controls. There the HEVC conformance suite
# passes 15 of 147 streams through ffmpeg without 0016 and 141 with it, the software
# decoder's own score on that board. On this SoC its effect is unproven, and settling
# it needs the Fluster conformance suite on an RK3576 board. It is one file and
# depends on nothing else here. Its kernel-side counterpart is 083 in
# series/rk3576-fixes, which bounds what those controls may say.
#
# Ordering is the RK3588 series' order, narrowed: 0002 and 0013 both edit
# libswscale/swscale_unscaled.c and 0013 builds on 0002's hunks, so the two stay in
# this sequence.

# Declared intent; the builder's verify-applies gate is the enforcement. The range
# is the FFmpeg tree's, not the kernel's -- these patches sit on the
# `v4l2-request-n8.1` base the SoC layer pins, and the kernel bound is inherited
# from whichever other series a build composes alongside this one.
applies_to_kernel = ">=7.1, <7.3"

kernel = []

ffmpeg = [
    "media-accel/ffmpeg/0001-lavu-add-NV15-and-NV20-bitstream-formats-support.patch",
    "media-accel/ffmpeg/0002-lsws-add-NV15-and-NV20-formats-support.patch",
    "media-accel/ffmpeg/0005-hwcontext-v4l2request-tag-nv15-nv20-as-themselves.patch",
    "media-accel/ffmpeg/0013-lsws-nv15-nv20-do-not-drop-row-tail-samples.patch",
    "media-accel/ffmpeg/0016-v4l2request-hevc-set-sps-rps-controls.patch",
]

userspace = []
uboot     = []
