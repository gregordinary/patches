# SPDX-License-Identifier: GPL-3.0-or-later
# series/rk3576-npu.toml
#
# RK3576 NPU (rocket) enablement: the ordered kernel series that makes the
# mainline in-tree `rocket` DRM-accel driver bind the RK3576 NPU and expose the
# accel uAPI (/dev/accel). Referenced by a board that opts in via
# `device_patch_series`; composed after rk3576-fixes on the RK3576 kernel.
#
# EXPERIMENTAL, and deliberately so: this is a bring-up and reverse-engineering
# scaffold rather than a drop-in accelerator. The RK3576 NPU register map is
# shifted and re-packed relative to the RK3588, so a register program written for
# the RK3588 geometry does not run here -- a userspace has to carry its own RK3576
# encoder. What the kernel side does deliver is a device that submits and completes
# jobs one after another: an int8 convolution encoded for this part is bit-exact on
# real silicon, including multi-task row-windowed programs submitted with no gap
# between tasks.
#
# 0001-0007, 0031, 0032 and 0034 come from the linux-rockchip series "accel/rocket: RK3576
# NPU (RKNN) enablement" (Jiaxing Hu), tracked at its v8 posting except 0034, which is
# v9's 03/13; everything else is ours. 0001, 0003, 0004, 0005, 0031 and 0032 are
# verbatim; 0002, 0006, 0007 and 0034 carry local changes.
#
# 0001 widens the binding to describe the RK3576 node and pins the exact shape per
# compatible in an allOf, which is what makes a one-domain RK3576 core a dtbs_check
# failure rather than a core that runs with its convolution buffer half fed. It does
# not widen the register banks: the node this series emits carries five rather than
# three, because the driver reads the DPU's own completion, and that is our 0033 --
# kept separate so the carried patch stays the reviewed one.
#
# 0002 is rebased over rk3576-fixes. That series and this one both extend
# pm-domains.c's DOMAIN_RK3576 macro and table -- one adds a regulator argument for
# the GPU, the other a delay -- and the resolver always orders rk3576-fixes first (a
# SoC-wide kernel series) and rk3576-npu second (a board-opt-in device series), so the
# merged macro takes both. Because the regulator is already an argument here, the
# DOMAIN_RK3576_R spelling the upstream patch adds for RK3576_PD_NPU is not needed and
# that domain passes its argument directly. Re-derive it the same way on a future
# re-sync. 0002 also renames DOMAIN_M_O_R_G to DOMAIN_M_O_R_G_W, following upstream, so
# that the merged macro is signature-identical to theirs.
#
# 0003 takes the domain's resets with dev_err_probe(), so a reset controller that has
# not probed yet defers quietly instead of logging a failure.
#
# 0006 attaches the power domains the node lists instead of deciding from the SoC it
# matched, so the phandle count is a hardware description and not a driver-dispatch
# signal. That is the one place this series and upstream differ on mechanism: upstream
# gates the attach on a per-SoC multi_power_domain flag. It also holds a runtime PM
# reference across the register dump rocket_job_timedout() logs, taking it with
# pm_runtime_get_if_active() rather than testing pm_runtime_active(): the test only
# samples, and the domain can drop between it and the first readl, where a register
# access with the domain down takes an async SError on this part.
#
# 0007 carries one local change: each core takes five register banks rather than three,
# because 0012 and its successors retire a job on the DPU's and the PPU's own
# completions and need those banks mapped. The rest of what this file used to list as
# local -- rknn_core_1 at 0x27708000, the CBUF clocks on core 1, both NPU power domains
# on both core nodes -- is upstream as of v8 and is no longer a divergence. The board
# patch (enable NPU on the Radxa ROCK 4D) is dropped: the board enable is
# board-specific, and the H96 wires its own via its device `.dts`.
#
# One consequence of v8 to know before wiring a board: RK3576_PD_NPU now carries
# need_regulator, so a board that describes the NPU rail with domain-supply on the
# pd_npu node (0007 labels it) has that rail enabled before the domain powers and
# disabled after. A board that does not describe it takes the dummy regulator and is
# unchanged. npu-supply on the core node has no consumer anywhere in the tree; the
# binding requires it, and that is the only reason it is set.
#
# 0008 is ours and is required for back-to-back submits. It gives rocket_soc_data a
# task_number_bits field, because PC_TASK_CON's TASK_NUMBER is 12 bits wide on the
# RK3588 and 16 on the RK3576; the driver's fixed RK3588 word asks this part for a
# task count of 28673, which leaves the PC mid-program so only the first submit of
# each power session computes.
#
# 0009-0012 are ours and are the completion path. 0006 polls PC_DONE on an hrtimer
# because PC_DONE is read-only in INTERRUPT_MASK on this SoC, so the poll period is
# the per-submit floor; 0009 makes it a module parameter. 0011 keeps the IOMMU domain
# attached across jobs, which removes the per-job detach that faults writes still in
# flight and wedges the next job's enable_stall. 0012 retires a job on the DPU's own
# completion bits in INTERRUPT_RAW_STATUS -- what the RK3588 takes its interrupt on --
# rather than on PC_DONE, which means the program counter finished issuing the task and
# not that the write DMA has drained; the wait is bounded by a dpu_grace_us parameter
# (500 us) because a task with a wide DPU output element raises no DPU bit at all. That
# is what lets the poll period ship at 50 us: 2.42x per submit against the 500 us it
# replaces, and correct where PC_DONE at that period hands back partial surfaces. 0010
# fixes rocket_job_run()'s two early returns, which leak a runtime-PM reference and a
# scheduler credit and pin the NPU runtime-active past a module reload; that bug is
# mainline's and the RK3588 reaches the same paths, so 0010 duplicates no RK3588 patch
# only because none exists yet. See rk3576/npu/README.md for the measurements.
#
# 0013 and 0014 are ours and are two ways an unprivileged caller crashes the kernel
# through /dev/accel, which is group `render`. 0013 takes the job's IOMMU domain at
# construction: rocket_job_cleanup() puts it unconditionally, but the submit ioctl
# assigns it only after five rejection sites, so a malformed submit reaches the put
# with the kzalloc's NULL. 0014 moves the IOVA allocator from rocket_file_priv into
# the refcounted rocket_iommu_domain: a BO's IOVA node is removed in its GEM free
# path, which the drm_sched free worker can run after the owning file has closed, so
# a client that submits and closes without waiting frees the allocator out from under
# it. Both are mainline code that the RK3576 enablement does not touch -- the RK3588
# series carries the same fixes as 084 and 085 -- and they are here because this is
# the series the RK3576 image applies.
#
# 0015-0017 are ours and are the submit uAPI. 0015 makes the submit descriptors
# actually extensible -- the size fields promise forward compatibility that guarding on
# the kernel's own sizeof() defeats, so it guards on the v1 offsetofend() minimum and
# copies with copy_struct_from_user(), which refuses a field this kernel does not know
# with -E2BIG instead of dropping it. It also reports a rejected job (the return was
# discarded, so SUBMIT answered 0 for a job it dropped) and declares interface version
# 1.0. That is what lets 0016 and 0017 each append to drm_rocket_job.flags without
# breaking an already-built userspace.
#
# 0016 and 0017 are per-job levers over the poll floor, both advertised through
# DRM_IOCTL_VERSION (1.1 and 1.2) so userspace can ask before relying on them. 0016
# runs a job's tasks from one HW kick -- PC_TASK_CON.TASK_NUMBER = task_count, one
# completion instead of one per task -- for a job flagged DRM_ROCKET_JOB_BATCHED, whose
# regcmds userspace has laid out contiguously and self-chained. It is per job, not a
# module param, so a chained-layout job and a gapped-layout job coexist in one process;
# rocket_batch_submit is only a master kill switch over the flag. 0017 splits
# dpu_grace_us in two: for an ordinary job it is a correctness deadline on a completion
# that is coming, but for a job whose DPU output element is wider than one byte no
# completion ever arrives and the same number is a blind settle paid in full on every
# submit. The driver cannot tell the classes apart at PC_DONE time and userspace can, so
# DRM_ROCKET_JOB_NO_DPU_DONE names it and selects dpu_blind_us (250 us) instead. It is
# advisory -- a completion that does arrive still retires the job -- so a wrong hint
# costs time, never correctness. 0016 needs a userspace that emits the chained layout
# (rocket-userspace, ROCKET_RK3576_BATCH_TASKS); an unflagged job is unaffected by both.
#
# 0018-0020 are ours and are three more ways an unprivileged caller reaches a kernel
# defect through /dev/accel, all of them mainline code the RK3588 reaches unchanged.
# 0018 puts the file's IOMMU domain when CREATE_BO fails: every error path frees the
# object with drm_gem_shmem_object_free(), which calls drm_gem_shmem_free() directly
# and so never reaches the .free handler that would drop the reference, leaking one
# domain per failed create -- and with 0014 that pins the IOVA allocator and every
# mapping it holds. 0019 frees the scheduler array the file allocated: the entity
# keeps that pointer only when it has more than one runqueue to choose between, so
# on a single-core device -- the supported RK3576 configuration -- the close path
# frees NULL and leaks the array on every open. 0020 is a double free of the submit
# ioctl's task array, which rocket_copy_tasks() frees on its failure path without
# clearing and rocket_job_cleanup() then frees again; a kmalloc-16 object handed to
# two owners, reached by a job that asks for no registers. 0020 is verified on the
# RK3576 under slub_debug=FZPU and carried for the RK3588 as rocket/087.
#
# 0021 is ours and closes the last class of job that retires on a deadline rather than on
# a completion. PC_OPERATION_ENABLE is a per-block bitmap and a pooling program enables
# PPU/PPU_RDMA (0x60) against a convolution's CNA/CORE/DPU/DPU_RDMA (0x1d), so a pool has
# no DPU stage at all and the DPU bits 0012 waits on can never set for it -- every pooling
# job pays dpu_grace_us in full, 641 us of a 1024x7x7 k7 average pool's wait at the 500 us
# default and 640 us of a 6.2 ms MobileNetV1-224 inference. The PPU raises its own
# completion two bits over in the same register; DRM_ROCKET_JOB_PPU_DONE (interface
# version 1.3) selects those bits for a job whose LAST program is a PPU program. Like
# 0017 it is per-job because only userspace knows the class, and a wrong hint costs the
# grace period rather than correctness -- except for a job that mixes DPU and PPU programs
# in one chained stream, which must not set it.
#
# 0022 is ours and anchors the completion wait on the hardware's own account of where the
# kick is. Neither signal 0012's wait was taken from says what it was read as.
# PC_OPERATION_ENABLE is a self-clearing GO bit that reads back zero at every poll of a
# running kick, so the first half of that condition has been vacuously true and every wait
# started at the first poll tick rather than at an event. PC_DONE is raised per TASK, so on
# a job batched by 0016 it is seen tens of microseconds into a stream that runs for
# milliseconds -- dpu_grace_us, measured as one task's drain, was covering a whole stream,
# and past it the fence signals while the core is still writing. From userspace that looks
# like a hardware bound on how long a chained stream may be; it is not one. PC_TASK_STATUS
# is a live pair of counters -- tasks started in bits 15:0, tasks completed in 31:16, both
# modulo the programmed TASK_NUMBER -- and mid-stream at least one is non-zero, so with a
# PC_DONE in hand a zero register means the whole kick is over and nothing else does. The
# wait is held off until then, which makes dpu_grace_us once again the drain it was measured
# as, applied to the program that wrote last. A job of one task programs TASK_NUMBER = 1,
# where both counters read zero always, so PC_DONE alone stays its signal and its wait is
# unchanged. A job raising no PC_DONE at all retires on a backstop at a quarter of the
# scheduler's job timeout, with the reason logged. Interface version 1.4 carries no new
# uAPI: the bump exists because only from here is a batched stream's length bounded by
# nothing but that timeout, and a caller that sizes its streams has no other way to tell.
#
# 0023 is ours and makes cache maintenance cost what the caller touches rather than what the
# buffer is. PREP_BO and FINI_BO sync the whole scatterlist, which measures a per-ioctl floor
# of about a microsecond plus 0.097 us/KiB per direction -- roughly 10.6 GB/s of cache walk --
# so past a few KiB the ioctl is entirely the walk, and a client reading a handful of bytes
# of a large surface pays for the surface. DRM_ROCKET_PREP_BO_RANGES and
# DRM_ROCKET_FINI_BO_RANGES (interface version 1.5) take an array of {offset, size} and sync
# only those; range_count == 0 means the whole object, so the new ioctls are supersets of the
# old ones and the old ones are untouched. Ranges must be ascending, non-overlapping and
# inside the BO, which is a contract rather than a convenience -- each range walks the
# scatterlist, so an unsorted array would cost O(ranges x segments) in the kernel on a
# caller's say-so -- and all three are refused with -EINVAL. Each range is split at page
# boundaries, because one dma_sync_single_*() must cover a PHYSICALLY contiguous span while a
# scatterlist segment is contiguous only in the DMA address space.
#
# 0024 is ours and stops the completion poll retiring a job it was not queued for. 0012's work
# item is queued by the hrtimer and runs later, and it is not the only path into
# rocket_job_handle_irq(): the shared interrupt still reports the DMA-error bits and its thread
# retires whatever is in flight, as does a reset. So the timer can queue the work for job N, the
# error thread retire job N, drm_sched push job N+1, and the still-queued work then retire N+1 as
# well -- signalling its fence while the hardware is still writing, which hands the caller a
# silently short surface rather than an error. A per-submit sequence number, snapshotted onto the
# work when it is queued and compared before anything is retired, makes a stale work item a no-op.
# The window needs a DMA error or a reset inside one poll period, which is not rare on this part
# while a driver or an encoder is under development. No uAPI change, so the interface version
# stays at 1.5, and the RK3588 does not reach it at all (it has a completion interrupt, so
# soc->poll_completion is false and no poll work is ever queued).
#
# 0025 is ours and closes the half 0022 left. 0022 stopped a batched STREAM's length being a
# property of the driver's timing; past the kick, one program's own drain was still bounded by
# dpu_grace_us. PC_DONE means the program counter retired the last task, not that the task has
# finished computing, and on a job of one task -- TASK_NUMBER = 1, both PC_TASK_STATUS counters
# reading zero always -- PC_DONE alone is the kick-over signal and is raised while the pipeline
# still has the whole convolution to run. So a fitted 500 us was covering an entire program's
# execution, and every value is too small for some program. From userspace that wore a hardware
# capacity bound: a 112x112 k7 ic32 convolution bit-exact only up to a plane height that FALLS
# as the output-channel count rises (78 rows at two groups, 44 at four, 32 at six), handing back
# a full, correctly sized surface whose last rows of the last group are wrong. What those walls
# share is work, not footprint, and work is a time. The writing block raises its own completion,
# so wait for that: dpu_grace_us stays as an optional CAP and defaults to 0. 0022's backstop
# moves to cover this wait too, so a job whose block never completes retires there loudly
# instead of returning a truncated surface. What it costs is paid by a job that raises no
# completion and does not name itself with DRM_ROCKET_JOB_NO_DPU_DONE or
# DRM_ROCKET_JOB_PPU_DONE: it now waits out the backstop rather than losing 500 us. Over a
# 58-gate list only two rows move, both raw test submits passing no class flag; every library
# path names its class and is unmoved. Interface version 1.6 carries no new uAPI -- the bump
# exists because a caller that sizes its programs has no other way to tell an older kernel,
# where the failure is silent and looks like a capacity bound.
#
# 0026-0030 are ours and are five ways the driver's own bookkeeping is wrong rather
# than five ways the hardware is. 0026 resets with soc->num_resets, the count the
# resets were acquired with, instead of ARRAY_SIZE: on this SoC that walked an entry
# nothing asked for, which the reset core absorbs as a no-op against a NULL rstc and
# which stops being harmless now that 0003 makes srst_h a real line the power domain
# drives. 0027 takes rocket_job_handle_irq()'s two register writes under job_lock.
# rocket_job_hw_submit() writes OPERATION_ENABLE from inside that lock, so a
# completion's zero landing after a submit's one stops a task that has only just
# started; here the two writers are genuinely concurrent contexts, the poll work and
# the shared interrupt thread, and either can be inside hw_submit while the other is
# between its writes. 0028 is 0027's other half. rocket_reset() calls drm_sched_stop(),
# which returns without waiting for a threaded handler that is already running, so the
# comment that followed it -- "Remaining interrupts have been handled" -- stated an
# assumption rather than something the code arranged, and a handler mid-flight keeps
# running against a core the reset is about to put through rocket_core_reset() and
# against an in_flight_job the reset has already dropped. The synchronize_irq() goes
# between the stop and the job_lock guard, because after 0027 the handler holds that
# lock for its whole body and waiting for it from inside the guard would deadlock
# rather than fence anything. The poll work is already fenced above by
# cancel_work_sync(), so what this closes is the shared interrupt thread the RK3576
# still takes for the DMA-error bits. Ahead of the wait it clears INTERRUPT_MASK, since
# waiting alone fences the handler that is running and not the interrupt the hardware is
# still entitled to raise: hw_submit() arms the mask on every submit -- the DMA-error
# pair here -- and only the hardirq clears it, so on an ordinary timeout it is still
# live. That write is the function's first register access and the function holds no
# runtime PM reference of its own, so it goes under pm_runtime_get_if_active(), which
# holds one rather than sampling it; with the domain down a register access takes an
# async SError on this part. rocket/091 is the same change for the RK3588.
# 0029 stops the poll writing registers with nothing in flight.
# An interrupt has a level-triggered condition that INTERRUPT_CLEAR ends, so it must
# write whatever the state; the poll sampled a status register and has nothing to
# acknowledge, and the retire it missed already dropped the runtime-PM reference, so
# the core can be suspended and the write reaches a gated NPU. 0024's poll_seq does
# not cover it -- that only advances in hw_submit, so a retire with nothing submitted
# behind it leaves the work looking current -- and in_flight_job is the state that
# does. 0030 sequences the poll against teardown: the poll starts hardware work and
# drm_sched_fini() does not wait for a queued work item, so a poll_dying flag stops
# it ACTING before the scheduler goes and the timer is CANCELLED after, where a job
# in flight can no longer re-arm it from behind the cancel. The flag is cleared in
# rocket_job_init(), because struct rocket_core outlives an unbind whenever another
# core stays bound and a rebinding core would otherwise never retire again.
#
# 0034 lets a core suspend after a reset. rocket_reset() put the in-flight job's
# runtime PM reference back with pm_runtime_put_noidle(), a bare decrement that
# requests nothing, so a core came out of a timeout at usage_count 0 but still
# runtime-active and did not suspend until something else asked. On this SoC that is
# the difference between a working NPU and a dead one: the power domain does its work
# on power-on -- the BIU reset cycle 0003 adds -- and a core that never suspends never
# powers up again to get it, so the IOMMU stops answering and the next job comes back
# as the output zero point with MMU_DTE_ADDR complaints. Upstream measured 0 of 128
# channels against 128 of 128 on one boot with that single line as the variable. The
# put in rocket_job_run()'s failed get_sync() stays bare, because it unwinds a
# reference to a device that never resumed.
#
# 0031-0033 are the schema for what 0003, 0007 and the completion path describe, and
# they are last only because Documentation/ has no apply-order dependency on anything.
# Every DT they cover is rejected without them. 0031: pd-node carries no `resets`
# property and is unevaluatedProperties: false at every nesting level, so the
# SRST_A_RKNN0/1_BIU phandles 0007 puts on the NPU power domains do not validate.
# 0032: rockchip,iommu pins `clocks` and `clock-names` at exactly the aclk/iface pair
# and REQUIRES clock-names, so the five-clock MMU nodes fail on both counts -- and it
# gives the RK3576 NPU MMUs a compatible of their own, rockchip,rk3576-npu-iommu, with
# an allOf pinning both clock sets, so that an rk3568-iommu with five clocks and an NPU
# MMU with two are each rejected rather than both being spelled validly. 0007 emits
# that compatible; the driver reaches the node through the rockchip,rk3568-iommu
# fallback either way, so nothing in drivers/iommu has to know the name. 0033 is ours
# and widens `reg`/`reg-names` to the five banks 0007 emits, pinning RK3588 back to
# three in the same allOf.
#
# 0004 and 0005 are BOTH upstream now -- "iommu/rockchip: Take all DT clocks" and
# "iommu/rockchip: Clear stale page faults before enabling stall", merged 2026-07-26
# and present in linux-next from next-20260814. Neither is in 7.1.x, which is why both
# are still carried here, and it is why the v8 posting of this series drops them. When
# this series moves to a kernel that has them, each becomes a redundant patch that
# `git am --3way` will absorb silently rather than reject, so both have to be dropped
# by hand at that bump.
#
# 0006 gates the RK3576 support behind of_device_id match data (rk3576_soc_data), so
# the RK3588's behaviour is unchanged and the rk3588-accel series is unaffected; 0008
# keeps that property, since RK3588 at 12 bits still emits its original 0x7001. The
# RK3588 code path is no longer byte-unchanged, though: 0006 exports the match table
# as rocket_dt_match so that rocket_device_init() counts cores over it rather than over
# a second, hand-kept list of compatibles. The array sized from that count is indexed
# by every core that goes on to probe, so the two lists cannot be allowed to disagree,
# and one list is the way to guarantee that. Patches 4-5 touch the shared Rockchip
# IOMMU driver; that is contained because only a kernel built with this series carries
# them.
#
# The list is the authoritative apply order for the kernel tree, applied with
# `git am --3way`; paths are relative to this repo's root.

# Declared intent; the builder's verify-applies gate is the enforcement. Every patch
# here reads the same on 7.1 and 7.2 -- 7.2 moves nothing under the NPU, the Rockchip
# IOMMU driver or the power-domain driver that these touch, and 0004 is still not
# upstream, so nothing is silently absorbed. The ceiling is 7.3 because 7.2 is the
# newest generation the series has been dry-run against.
applies_to_kernel = ">=7.1, <7.3"

