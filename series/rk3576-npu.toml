# SPDX-License-Identifier: GPL-3.0-or-later
# series/rk3576-npu.toml
#
# RK3576 NPU (rocket) enablement: the ordered kernel series that makes the
# mainline in-tree `rocket` DRM-accel driver bind the RK3576 NPU and expose the
# accel uAPI (/dev/accel). Referenced by a board that opts in via
# `device_patch_series`; composed after rk3576-fixes on the RK3576 kernel.
#
# EXPERIMENTAL, and deliberately so: this is a bring-up and reverse-engineering
# scaffold rather than a drop-in accelerator. The RK3576 NPU register map is
# shifted and re-packed relative to the RK3588, so a register program written for
# the RK3588 geometry does not run here -- a userspace has to carry its own RK3576
# encoder. What the kernel side does deliver is a device that submits and completes
# jobs one after another: an int8 convolution encoded for this part is bit-exact on
# real silicon, including multi-task row-windowed programs submitted with no gap
# between tasks.
#
# The series is patches 1-7 of the linux-rockchip RFC v2 "accel/rocket: RK3576 NPU
# (RKNN) enablement" (Jiaxing Hu), plus 0008 from this repo. Patches 1 and 3-6 are
# verbatim; 0002 and 0007 carry local changes. 0002 is rebased over rk3576-fixes (both
# extend the pm-domains.c DOMAIN_RK3576 macro and table; the merge carries both the
# .delay_us and .need_regulator arguments). 0007 corrects rknn_core_1, which sits at
# 0x27708000 -- the two cores are the halves of one 64 KB RKNN TOP window and 0x27710000
# is the unrelated RKNN_NSP block -- gives it the two CBUF clocks its own IOMMU and
# power domain already list, and puts both NPU power domains on both core nodes, which
# rocket requires of every RK3576 core and so belongs to the SoC rather than to each
# board. See rk3576/npu/README.md for all of them. Patch 8 of that RFC (enable NPU on
# the Radxa Rock 4D) is dropped: the board enable is board-specific, and the H96 wires
# its own via its device `.dts` (npu-supply = vdd_npu_s0 and status = "okay").
#
# 0008 is ours and is required for back-to-back submits. It gives rocket_soc_data a
# task_number_bits field, because PC_TASK_CON's TASK_NUMBER is 12 bits wide on the
# RK3588 and 16 on the RK3576; the driver's fixed RK3588 word asks this part for a
# task count of 28673, which leaves the PC mid-program so only the first submit of
# each power session computes.
#
# 0009-0012 are ours and are the completion path. 0006 polls PC_DONE on an hrtimer
# because PC_DONE is read-only in INTERRUPT_MASK on this SoC, so the poll period is
# the per-submit floor; 0009 makes it a module parameter. 0011 keeps the IOMMU domain
# attached across jobs, which removes the per-job detach that faults writes still in
# flight and wedges the next job's enable_stall. 0012 retires a job on the DPU's own
# completion bits in INTERRUPT_RAW_STATUS -- what the RK3588 takes its interrupt on --
# rather than on PC_DONE, which means the program counter finished issuing the task and
# not that the write DMA has drained; the wait is bounded by a dpu_grace_us parameter
# (500 us) because a task with a wide DPU output element raises no DPU bit at all. That
# is what lets the poll period ship at 50 us: 2.42x per submit against the 500 us it
# replaces, and correct where PC_DONE at that period hands back partial surfaces. 0010
# fixes rocket_job_run()'s two early returns, which leak a runtime-PM reference and a
# scheduler credit and pin the NPU runtime-active past a module reload; that bug is
# mainline's and the RK3588 reaches the same paths, so 0010 duplicates no RK3588 patch
# only because none exists yet. See rk3576/npu/README.md for the measurements.
#
# Patch 6 gates the RK3576 support behind of_device_id match data
# (rk3576_soc_data), so the RK3588 code path is byte-unchanged and the rk3588-accel
# series is unaffected; 0008 keeps that property, since RK3588 at 12 bits still
# emits its original 0x7001. Patches 4-5 touch the shared Rockchip IOMMU driver;
# that is contained because only a kernel built with this series carries them.
#
# The list is the authoritative apply order for the kernel tree, applied with
# `git am --3way`; paths are relative to this repo's root.

# Declared intent; the builder's verify-applies gate is the enforcement.
applies_to_kernel = ">=7.1, <7.2"

kernel = [
    "rk3576/npu/0001-dt-bindings-npu-rockchip-add-rk3576-rknn-core.patch",
    "rk3576/npu/0002-pmdomain-rockchip-add-optional-power-on-settle-delay.patch",
    "rk3576/npu/0003-pmdomain-rockchip-cycle-power-domain-resets-on-power-on.patch",
    "rk3576/npu/0004-iommu-rockchip-take-all-dt-clocks.patch",
    "rk3576/npu/0005-iommu-rockchip-clear-stale-page-faults-before-stall.patch",
    "rk3576/npu/0006-accel-rocket-add-rk3576-npu-support.patch",
    "rk3576/npu/0007-arm64-dts-rockchip-rk3576-add-npu-nodes.patch",
    "rk3576/npu/0008-accel-rocket-program-pc-task-con-per-soc-task-number.patch",
    "rk3576/npu/0009-accel-rocket-make-the-rk3576-completion-poll-period-tunable.patch",
    "rk3576/npu/0010-accel-rocket-complete-jobs-that-never-reach-the-hardware.patch",
    "rk3576/npu/0011-accel-rocket-keep-the-iommu-domain-attached-across-jobs.patch",
    "rk3576/npu/0012-accel-rocket-retire-an-rk3576-job-on-the-dpu-completion.patch",
]

ffmpeg    = []
userspace = []
uboot     = []
