# SPDX-License-Identifier: GPL-3.0-or-later
# series/rk3588-accel.toml
#
# RK3588 hardware acceleration: the ordered patch series that turns a mainline
# 7.1 kernel plus the ffmpeg/MPP userspace into the Turing RK1 media stack
# (VDPU381 decode, VEPU580 encode, RGA 2D, rocket NPU, crypto offload).
#
# A series is owned by a kernel definition, not a device: this series applies to
# mainline 7.1 and is referenced by kernels/rk3588-mainline-7.1. Each list is the
# authoritative apply order for one source tree, applied with `git am --3way`; a
# tree's list may span scopes (the kernel tree interleaves the media-accel,
# rocket and crypto scopes). Paths are relative to this repo's root.

# Declared intent; the builder's verify-applies gate is the enforcement.
#
# The floor is 060's, not the series': `rk3588-base.dtsi` lists `vdec0`'s `reg` and
# `reg-names` in the order its binding declares from 7.1.5, where earlier 7.1.x
# transposed "link" and "function". That node is 060's trailing context, so the patch
# reads one way or the other and cannot read both. It is written against the binding
# order, which puts the whole series at 7.1.5 -- a kernel that keeps 060 out keeps
# VEPU580 encode out, so filtering it per-patch would silently ship a different image
# rather than fail.
applies_to_kernel = ">=7.1.5, <7.2"

# Kernel tree: media-accel first (decode/encode/RGA), then rocket (NPU). Applying
# in ascending numeric order satisfies the series' dependencies: npu-volt needs
# npu-clk, batched-submit needs the IOMMU keep-attached patch, and batched-submit
# needs uapi-extensible-structs (085) -- 086 appends a field to drm_rocket_job,
# which is only safe for an older userspace because 085 makes the submit ioctl
# accept the v1 struct size. Applying 086 without 085 builds a kernel that rejects
# any userspace declaring the pre-@flags size. The npu-clk and BO-use-after-free
# patches are the ones that matter; the rest raise the performance ceiling.
#
# The RGA driver (070/071) is SoC-neutral and shared with series/rk3576-rga; 072
# is this SoC's own DT wiring for it, which is why the two are separate patches.
#
# 087 is a double free of the submit ioctl's task array: rocket_copy_tasks() frees
# it on its failure path and leaves the pointer set, and rocket_job_cleanup() then
# frees it again on the way out of the ioctl. Both reaching failures are ordinary
# userspace input and /dev/accel is group `render`, so it is an unprivileged double
# free of a kmalloc-16 object. Validated on RK3588 silicon under slub_debug: six
# "Object already free" reports over three runs without it, zero with it, and the
# test exits 0 either way -- so no gate catches this without slub_debug. The
# RK3576 carries the same fix as rk3576/npu 0020.
#
# 088 resets the NPU before detaching its IOMMU domain. rocket_reset() is entered
# because the core is wedged -- the one caller a client can reach is
# rocket_job_timedout() -- so detaching first runs the rk_iommu stall handshake
# against a master still mid-DMA, which cannot stall. That is a dev_err per MMU
# bank on every faulting job and, when the same handshake fails again behind the
# group's default domain, a WARN in the IOMMU core: a taint and a backtrace, and a
# panic under panic_on_warn. drm_rocket_task.regcmd is a raw NPU IOVA the driver
# writes into the PC block unvalidated and /dev/accel is group `render`, so an
# unprivileged client reaches it by pointing one field at an unmapped address.
# Resetting first quiesces the master -- and the reset is why the domain has to be
# dropped at all -- so by the detach the handshake has something it can stall.
# Validated on RK3588 silicon: thirty client-requested DMA faults per arm give 60
# stall timeouts without it, exactly two per fault, and zero with it, the thirty
# job timeouts unchanged. The RK3576 reaches the same detach and produces the same
# stall lines but not the WARN, so it is carried here only.
#
# 089 is Igor Paunovic's, taken from linux-rockchip where it is headed upstream, and
# it is the reason the driver holds the clocks it says it does. rocket_core_init()
# hands core->clks to devm_clk_bulk_get() with every .id left NULL, and a NULL con_id
# resolves by INDEX, so all four entries come back holding the first clock of the DT
# property -- ACLK_NPUn, four times. hclk, pclk and the SCMI compute clock are never
# prepared or enabled by this driver at all; the NPU runs only because the power-domain
# driver sets GENPD_FLAG_PM_CLK and its attach_dev() adds every clock in the node to
# the pm_clk list. 081's clock lever is unaffected either way, since it acquires "npu"
# by name itself, but a driver that holds no handle on the clock it re-rates is one
# accident away from a real defect and blocks any OPP work. rk3588-base.dtsi names all
# four clocks on all three cores, so the named lookup cannot fail here. rk3576/npu 0006
# carries the same four lines for its own SoC; when a kernel arrives with 089 upstream,
# both copies have to go.
#
# 050 ends in a defconfig hunk (`CONFIG_VSI_IOMMU=m`), and that hunk is load bearing:
# a consumer whose `base_defconfig` is the in-tree arm64 `defconfig` gets the AV1
# decoder's IOMMU from here and from nowhere else, since no kconfig fragment sets it.
# Upstream is re-sending the same line as part of "arm64: defconfig: enable Rockchip
# Multimedia drivers" (Sebastian Reichel), the first attempt having been this series'
# own 5/5. When a kernel arrives carrying it, 050's last hunk is a duplicate line
# rather than a rejection -- the same silent-absorption trap 0004 has in the rk3576
# series -- so re-curate 050 at that bump instead of trusting `git am --3way`.
#
# 090 takes rocket_job_handle_irq()'s OPERATION_ENABLE and INTERRUPT_CLEAR writes under
# job_lock. rocket_job_hw_submit() writes OPERATION_ENABLE from inside that lock, so a
# completion's zero landing after a submit's one stops a task that has only just
# started. The threaded handler cannot race itself, so the second writer here is
# rocket_reset() -- entered from rocket_job_timedout(), which a client reaches through
# the same unvalidated regcmd IOVA that 088 covers. rk3576/npu 0027 is the same change
# for that SoC, where the poll work and the interrupt thread make the two writers
# concurrent outright.
#
# 091 is 090's other half and Igor Paunovic's observation, from the v8 posting of the
# RK3576 series. rocket_reset() calls drm_sched_stop(), which stops the scheduler and
# returns; it does not wait for a threaded handler that is already running, so the
# comment that followed it -- "Remaining interrupts have been handled" -- stated an
# assumption rather than something the code arranged. A handler mid-flight when the
# reset starts keeps running against a core rocket_core_reset() is about to put through
# a reset, and against an in_flight_job the reset has already dropped. The
# synchronize_irq() has to sit between drm_sched_stop() and the job_lock guard: after
# 090 the handler holds job_lock for its whole body, so waiting for it from inside that
# lock would deadlock rather than fence anything, and both callers run in process
# context so sleeping there is allowed. It does not close the window where a handler
# has already read in_flight_job -- that is 090's -- and the two are complementary.
# rk3576/npu 0028 is the same change for that SoC.
#
# 100-104 are the crypto scope and are the RK356x/RK3588 second-generation crypto
# offloader: AES (ECB/CBC/XTS) and SHA-1/256/384/512, MD5 and SM3 over an LLI-based
# DMA engine. 100-103 are Dawid Olesinski's and Corentin Labbe's, carried verbatim
# from the linux-rockchip series "crypto: rockchip: Add RK356x/RK3588 cryptographic
# offloader" at its v3 posting, which is NOT merged. 104 is ours and is the reason
# the rest is worth applying here at all: CRYPTO_DEV_ROCKCHIP2 is a tristate with no
# default, no kconfig fragment in this collection sets it, and the upstream series
# carries no defconfig hunk -- so without 104 the DT nodes 102 and 103 add describe a
# device that nothing binds to. This is the same trap 050's trailing defconfig hunk
# covers for the AV1 decoder's IOMMU, and it fails the same silent way.
#
# The RK3588 binds through the rockchip,rk3568-crypto fallback compatible, which is
# why the driver's match table carries only the one entry; the SCMI clock and reset
# ids the node uses (SCMI_CRYPTO_CORE, SCMI_ACLK/HCLK_SECURE_NS, SCMI_SRST_CRYPTO_CORE)
# are all in the mainline dt-bindings headers, and rk3588-base.dtsi already reaches
# scmi_reset the same way its rng node does. 102 touches rk356x-base.dtsi, which no
# board here builds against; it is carried because the series is developed and tested
# as a unit and dropping a patch from the middle makes the next re-sync harder, not
# because we need it.
#
# Two things to know before trusting it. The nodes carry no `status`, so the block is
# enabled by default on every RK356x and RK3588 board built from these dtsi files --
# the clocks are the non-secure instance (SECURE_NS), but whether a given board's
# firmware also drives that block is not something this series establishes. And v3 is
# under review: the reset-names schema admits three names where both in-tree users
# list exactly one, the per-SG IV update in rk2_cipher_run() indexes the destination
# with a length taken from the source (safe only because rk2_cipher_need_fallback()
# rejects a source/destination chunk mismatch, which nothing at the use site says),
# and dma_free_coherent()/kfree() in .remove run before devres frees the IRQ. None of
# those is a reason to hold the series out of a build, and all of them are a reason to
# expect a v4 and to re-sync rather than to carry these files forever.
kernel = [
    "media-accel/kernel/040-vdpu381-multicore-v1-curated.patch",
    "media-accel/kernel/050-av1-iommu-v14-curated.patch",
    "media-accel/kernel/060-vepu580-rcawston-v3.patch",
    "media-accel/kernel/070-rga-multicore-vendor-oot.patch",
    "media-accel/kernel/071-rga-multicore-7.1-fixups.patch",
    "media-accel/kernel/072-rk3588-rga-dts.patch",
    "rocket/081-rocket-drv-npu-clk.patch",
    "rocket/082-rocket-drv-npu-volt.patch",
    "rocket/083-rocket-drv-iommu-keepattach.patch",
    "rocket/084-rocket-drv-fix-bo-mm-uaf.patch",
    "rocket/085-rocket-drv-uapi-extensible-structs.patch",
    "rocket/086-rocket-drv-batched-submit.patch",
    "rocket/087-rocket-drv-fix-task-array-double-free.patch",
    "rocket/088-rocket-drv-reset-before-iommu-detach.patch",
    "rocket/089-rocket-drv-clocks-by-name.patch",
    "rocket/090-rocket-drv-irq-under-job-lock.patch",
    "rocket/091-rocket-drv-irq-sync-before-reset.patch",
    "crypto/kernel/100-dt-bindings-crypto-rockchip-rk356x-rk3588-engine.patch",
    "crypto/kernel/101-crypto-rockchip-rk356x-rk3588-offloader.patch",
    "crypto/kernel/102-arm64-dts-rockchip-rk356x-crypto-node.patch",
    "crypto/kernel/103-arm64-dts-rockchip-rk3588-crypto-node.patch",
    "crypto/kernel/104-arm64-defconfig-enable-rockchip2-crypto.patch",
]

# ffmpeg tree (Kwiboo v4l2-request base + nyanmisaka rkmpp/rkrga graft): the graft
# materialized as an ordered `git am` series (0001-0004; one commit needs a 3-way
# resolution a cherry-pick cannot reproduce — see media-accel/ffmpeg/README.md),
# then the NV15/NV20 fix that scale_rkrga expects (0005).
ffmpeg = [
    "media-accel/ffmpeg/0001-lavu-add-NV15-and-NV20-bitstream-formats-support.patch",
    "media-accel/ffmpeg/0002-lsws-add-NV15-and-NV20-formats-support.patch",
    "media-accel/ffmpeg/0003-lavu-add-RKMPP-hwcontext.patch",
    "media-accel/ffmpeg/0004-lavf-rkrga-add-RKRGA-scale-vpp-and-overlay-filters.patch",
    "media-accel/ffmpeg/0005-rkrga-accept-v4l2request-10bit-nv15-nv20.patch",
]

# Userspace tree (librockchip-mpp): force MPP allocations onto the contiguous
# default_cma_region heap so VEPU580 encode works against the mainline kernel.
userspace = [
    "media-accel/userspace/001-mpp-allocator-dma-heap-mainline-cma.patch",
]

# u-boot tree: empty, because u-boot is its own axis. This series is the RK3588
# kernel/ffmpeg/userspace accel stack; a board that wants more than mainline u-boot
# selects a u-boot series of its own (the RK1's are turing-rk1-recovery and
# turing-rk1-util, from the rk3588 scope).
uboot = []
