# SPDX-License-Identifier: GPL-3.0-or-later
# series/rk3588-accel.toml
#
# RK3588 hardware acceleration: the ordered patch series that turns a mainline
# 7.1 or 7.2 kernel plus the ffmpeg/MPP userspace into the Turing RK1 media stack
# (VDPU381 decode, VEPU580 encode, RGA 2D, rocket NPU, crypto offload).
#
# A series is owned by a kernel definition, not a device. It spans the 7.1 and 7.2
# generations from one file, because 28 of its 30 kernel patches are identical
# across them: only 050 and 072 turn on the kernel version, and each carries its
# own `kernels` range below. Each list is the
# authoritative apply order for one source tree, applied with `git am --3way`; a
# tree's list may span scopes (the kernel tree interleaves the media-accel,
# rocket and crypto scopes). Paths are relative to this repo's root.

# Declared intent; the builder's verify-applies gate is the enforcement.
#
# The floor is 060's, not the series': `rk3588-base.dtsi` lists `vdec0`'s `reg` and
# `reg-names` in the order its binding declares from 7.1.5, where earlier 7.1.x
# transposed "link" and "function". That node is 060's trailing context, so the patch
# reads one way or the other and cannot read both. It is written against the binding
# order, which puts the whole series at 7.1.5 -- a kernel that keeps 060 out keeps
# VEPU580 encode out, so filtering it per-patch would silently ship a different image
# rather than fail.
#
# The ceiling is 7.3 because 7.2 is the newest generation the series has been dry-run
# against, not because 7.3 is known to break it.
applies_to_kernel = ">=7.1.5, <7.3"

# Kernel tree: media-accel first (decode/encode/RGA), then rocket (NPU). Applying
# in ascending numeric order satisfies the series' dependencies: npu-volt needs
# npu-clk, batched-submit needs the IOMMU keep-attached patch, and batched-submit
# needs uapi-extensible-structs (085) -- 086 appends a field to drm_rocket_job,
# which is only safe for an older userspace because 085 makes the submit ioctl
# accept the v1 struct size. Applying 086 without 085 builds a kernel that rejects
# any userspace declaring the pre-@flags size. The npu-clk and BO-use-after-free
# patches are the ones that matter; the rest raise the performance ceiling.
#
# 030 and 041-045 are the rkvdec multi-core stack, and they are one decision
# taken in two scopes. 041-045 are Detlev Casanova's "media: rkvdec: Enable
# multi-core support" v2 (patchwork series 1143522), carried as five files
# because that is what it is: an upstream series whose patches read in order.
# 041 sizes the RCB buffer per run so a resolution change cannot overflow it,
# 042 removes a dead need_reset check, 044 restructures rkvdec into split core
# and master platform drivers on the component framework, and 045 drives both
# hardware cores behind the single /dev/video0 -- one job per m2m context, but N
# streams across N cores. 043 exports v4l2_m2m_set_max_parallel_jobs(), which 045
# calls.
#
# 030 is why 043 has something to export. The function is in no released kernel:
# it comes from Sven Puschel's "Rockchip RGA multi-core" series (patchwork 1106861,
# patch 05/17), which is unmerged, so there is no commit to backport and the patch
# itself has to be vendored. It sorts ahead of the rkvdec patches because the whole
# series depends on it, and it is a separate file from them so it can be deleted on
# its own. Its blast radius is the reason to name it here rather than fold it in:
# it deletes curr_ctx from struct v4l2_m2m_dev and rewrites v4l2_m2m_try_run(),
# _v4l2_m2m_job_finish(), v4l2_m2m_get_curr_priv(), v4l2_m2m_suspend() and
# v4l2_m2m_streamoff() for every m2m driver in the kernel, not just rkvdec. The
# image builds others -- the two hantro nodes, VP8/MPEG decode and VEPU121 JPEG
# encode, go through the same core. max_parallel_jobs defaults to 1 in
# v4l2_m2m_init(), so every driver that does not set it keeps one-job-at-a-time
# behaviour.
#
# What this buys is concurrency headroom, not speed. A context is never run twice
# in parallel, so a single stream cannot use both cores and no decode gets shorter;
# what rises is how many independent streams the decoder sustains before frames
# drop. It is taken for maintenance alignment: both series are aimed at mainline,
# so a kernel that carries them absorbs this instead of colliding with it.
#
# Both are unmerged and both retire together: when a kernel this project bumps to
# carries the merged rkvdec series, 041-045 are dropped rather than rebased, and
# 030 and 043 go with them. rk3576/kernel/104 needs re-curation at that same bump
# -- it conflicts with 044 in four files and `git am --3way` cannot resolve it. It
# is named here because this is where that was found, not because it is RK3588 work.
#
# The RGA driver (070/071) is SoC-neutral and shared with series/rk3576-rga; 072
# is this SoC's own DT wiring for it, which is why the two are separate patches.
#
# 072 is the one patch that differs between the two kernel generations, and the
# reason is that 7.2 describes this hardware where 7.1 did not. 7.1's dtsi has a
# single `rga` node for the RGA2 core, so 072-7.1 replaces it and adds the two RGA3
# cores and their IOMMUs. 7.2 carries Sven Puschel's V4L2 RGA3 support, so all three
# cores and both RGA3 IOMMUs are already described -- for the in-tree driver -- and
# 072-7.2 only retargets them: the compatible strings pick the vendor driver and tell
# the two RGA3 cores apart, and each core's register window grows to the 4 KiB the
# driver needs to reach its IOMMU block at +0xf00. Both land on the same DT.
#
# Which driver binds is a kconfig decision the consumer makes, and the two are
# mutually exclusive in practice: a build that takes this series wants
# CONFIG_ROCKCHIP_MULTI_RGA and leaves CONFIG_VIDEO_ROCKCHIP_RGA unset. The in-tree
# 7.2 driver is a genuine alternative for a consumer that wants no out-of-tree code,
# at the cost of the /dev/rga ABI librga speaks: it exposes one core per V4L2 video
# node (multi-core scheduling is explicitly deferred upstream), implements scaling
# and colour conversion only, and has no 10-bit YUV -- so NV15, which is what a
# 10-bit HEVC decode on this SoC produces, has no path through it.
#
# 073 bounds the HEVC tile counts. `num_tile_columns_minus1` and
# `num_tile_rows_minus1` arrive from userspace as u8 and index fixed-size arrays --
# the backends' own stack scratch and the control's own `column_width_minus1[20]` /
# `row_height_minus1[22]` -- with no range check anywhere. The V4L2 core zeroes those
# fields when TILES_ENABLED is clear but does not bound them when it is set, so
# `compute_tiles_uniform()` loops to 256 writing a 20-entry stack array, and
# `compute_tiles_non_uniform()` also reads past the control payload and writes what it
# finds. Reachable by any local user in group `video`, and by anything feeding the
# decoder controls parsed from an untrusted bitstream -- which is this project's
# threat model, since a media server hands ffmpeg arbitrary files. The fix rejects in
# `try_ctrl` rather than clamping, so a bad stream fails cleanly instead of decoding
# wrong, and the bound is the uAPI array size, which is also the HEVC maximum -- no
# conforming stream is refused. Not RK3588-specific: it fixes all three rkvdec HEVC
# backends, so series/rk3576-fixes carries this same file, after its own 104 -- the
# same sharing 070/071 have with series/rk3576-rga.
#
# 074 is the AV1 half of the same class, in the Hantro/VPU981 stateless decoder
# (/dev/video3 on the RK1). tile_cols and tile_rows arrive from userspace in the AV1
# frame control as u8 and reach fixed-size arrays with no range check anywhere:
# validate_av1_frame() in the V4L2 core checks quantization, segmentation, loop filter,
# cdef, loop restoration, the frame flags and superres_denom, but never the tile counts.
# rockchip_vpu981_av1_dec_set_tile_info() then divides context_update_tile_id by
# tile_cols (a zero count is a divide error), indexes width_in_sbs_minus_1[64] /
# height_in_sbs_minus_1[64] by the counts, writes tile_cols * tile_rows records into a
# 128-record scratch buffer, and indexes the 512-entry tile-group control by
# tile1 * tile_cols + tile0 -- so a count of 255 overflows the scratch, reads two arrays
# and the tile-group control out of bounds, and can divide by zero, all before the
# hardware is touched. Same threat model as 073. The fix rejects in prepare_run, so the
# buffer is failed with VB2_BUF_STATE_ERROR instead of the decode corrupting memory.
# Unlike 073, the two bounds differ in kind: the per-dimension caps are the uAPI array
# sizes, which are also the AV1 maxima, so they refuse nothing conforming; the product
# cap is AV1_MAX_TILES (128), the size of the tile_info scratch this core fills, which
# is below the uAPI's 512-tile ceiling -- so a conforming frame with more than 128 tiles
# is refused, because this hardware cannot decode it regardless. Not RK3588-specific:
# the VPU981 file is shared, so any SoC that binds HANTRO_AV1_DECODER gets the fix.
# The divide-by-zero and the scratch overflow are also the two defects upstream's
# "[PATCH v3 0/9] media: bound stateless HEVC/AV1 tile counts" 6-7 guard; if that series
# merges, drop 074 rather than carry it, the same silent-absorption trap 050 has.
# Note 074 rejects through rockchip_vpu981_av1_dec_run()'s prepare_error path, which is
# buggy in the base kernel -- that is what 075 fixes; see below.
#
# 075 is Sascha Hauer's "media: verisilicon: Fix the cleanup when a codec ->run() fails",
# patch 1/7 of the unmerged rk3588-jpegdec series (Pengutronix, 2026-08-19), carried
# unmodified. The base kernel's ->run() error path is broken: rockchip_vpu981_av1_dec_run()
# calls hantro_irq_done() and returns the error to device_run(), which finishes the job a
# second time (a WARN_ON(!src) splat), and hantro_end_prepare_run() arms a watchdog for a
# job that never starts, so it fires two seconds later and aborts an unrelated decode. 074
# does not introduce this -- the -ENOMEM and vb2_src paths already hit it -- but it makes
# it reliably reachable from a crafted tile count, so on a multi-stream box (an NVR, a
# multi-client Jellyfin) a rejection can disrupt a concurrent decode. 075 gives
# hantro_end_prepare_run() an error argument so a failed ->run() completes the media
# request without the double finish or the watchdog mis-arm, which makes 074's rejection
# fully clean. It is a codec-agnostic core change touching every hantro codec's ->run()
# caller and hantro_end_prepare_run()'s signature, so it is carried as its own patch rather
# than folded into 074, and it is dropped when it lands upstream -- the same silent
# retirement 050 and 073 have. The rest of that series (the VPU720 JPEG decoder, patches
# 4-7) is deliberately NOT carried: no ffmpeg path drives a Rockchip hardware JPEG decoder,
# so the driver would have no consumer here (see TODO.md section 4).
#
# 087 is a double free of the submit ioctl's task array: rocket_copy_tasks() frees
# it on its failure path and leaves the pointer set, and rocket_job_cleanup() then
# frees it again on the way out of the ioctl. Both reaching failures are ordinary
# userspace input and /dev/accel is group `render`, so it is an unprivileged double
# free of a kmalloc-16 object. Validated on RK3588 silicon under slub_debug: six
# "Object already free" reports over three runs without it, zero with it, and the
# test exits 0 either way -- so no gate catches this without slub_debug. The
# RK3576 carries the same fix as rk3576/npu 0020.
#
# 088 resets the NPU before detaching its IOMMU domain. rocket_reset() is entered
# because the core is wedged -- the one caller a client can reach is
# rocket_job_timedout() -- so detaching first runs the rk_iommu stall handshake
# against a master still mid-DMA, which cannot stall. That is a dev_err per MMU
# bank on every faulting job and, when the same handshake fails again behind the
# group's default domain, a WARN in the IOMMU core: a taint and a backtrace, and a
# panic under panic_on_warn. drm_rocket_task.regcmd is a raw NPU IOVA the driver
# writes into the PC block unvalidated and /dev/accel is group `render`, so an
# unprivileged client reaches it by pointing one field at an unmapped address.
# Resetting first quiesces the master -- and the reset is why the domain has to be
# dropped at all -- so by the detach the handshake has something it can stall.
# Validated on RK3588 silicon: thirty client-requested DMA faults per arm give 60
# stall timeouts without it, exactly two per fault, and zero with it, the thirty
# job timeouts unchanged. The RK3576 reaches the same detach and produces the same
# stall lines but not the WARN, so it is carried here only.
#
# 089 is Igor Paunovic's, taken from linux-rockchip where it is headed upstream, and
# it is the reason the driver holds the clocks it says it does. rocket_core_init()
# hands core->clks to devm_clk_bulk_get() with every .id left NULL, and a NULL con_id
# resolves by INDEX, so all four entries come back holding the first clock of the DT
# property -- ACLK_NPUn, four times. hclk, pclk and the SCMI compute clock are never
# prepared or enabled by this driver at all; the NPU runs only because the power-domain
# driver sets GENPD_FLAG_PM_CLK and its attach_dev() adds every clock in the node to
# the pm_clk list. 081's clock lever is unaffected either way, since it acquires "npu"
# by name itself, but a driver that holds no handle on the clock it re-rates is one
# accident away from a real defect and blocks any OPP work. rk3588-base.dtsi names all
# four clocks on all three cores, so the named lookup cannot fail here. rk3576/npu 0006
# carries the same four lines for its own SoC; when a kernel arrives with 089 upstream,
# both copies have to go.
#
# 050 is the AV1 decoder's IOMMU and applies to 7.1 only. Four of its five patches --
# the binding, the driver, the RK3588 DT node and the MAINTAINERS entry -- are in 7.2
# as `iommu: Add verisilicon IOMMU driver` and its two follow-up cleanups, and the
# tree's copy is the newer one, so on 7.2 the patch is not rebased but dropped.
#
# Its fifth hunk did not land, and it is load bearing: `CONFIG_VSI_IOMMU` is a
# tristate with no default, so on 7.2 a consumer whose `base_defconfig` is the
# in-tree arm64 `defconfig` builds no AV1 IOMMU at all and AV1 decode fails at
# probe. Set the symbol from a kconfig fragment -- the series cannot, since a
# defconfig hunk is all a patch has, and adding one back would only re-open the
# conflict. This is the silent-absorption trap in its exact shape: the part that
# breaks a build is the part upstream did not take, and `git am --3way` reports
# nothing either way.
#
# 090 takes rocket_job_handle_irq()'s OPERATION_ENABLE and INTERRUPT_CLEAR writes under
# job_lock. rocket_job_hw_submit() writes OPERATION_ENABLE from inside that lock, so a
# completion's zero landing after a submit's one stops a task that has only just
# started. The threaded handler cannot race itself, so the second writer here is
# rocket_reset() -- entered from rocket_job_timedout(), which a client reaches through
# the same unvalidated regcmd IOVA that 088 covers. rk3576/npu 0027 is the same change
# for that SoC, where the poll work and the interrupt thread make the two writers
# concurrent outright.
#
# 091 is 090's other half and Igor Paunovic's observation, from the v8 posting of the
# RK3576 series. rocket_reset() calls drm_sched_stop(), which stops the scheduler and
# returns; it does not wait for a threaded handler that is already running, so the
# comment that followed it -- "Remaining interrupts have been handled" -- stated an
# assumption rather than something the code arranged. A handler mid-flight when the
# reset starts keeps running against a core rocket_core_reset() is about to put through
# a reset, and against an in_flight_job the reset has already dropped. The
# synchronize_irq() has to sit between drm_sched_stop() and the job_lock guard: after
# 090 the handler holds job_lock for its whole body, so waiting for it from inside that
# lock would deadlock rather than fence anything, and both callers run in process
# context so sleeping there is allowed. It does not close the window where a handler
# has already read in_flight_job -- that is 090's -- and the two are complementary.
# rk3576/npu 0028 is the same change for that SoC.
#
# 100-103 are the crypto scope and are the RK356x/RK3588 second-generation crypto
# offloader: AES (ECB/CBC/XTS) and SHA-1/256/384/512, MD5 and SM3 over an LLI-based
# DMA engine. They are Dawid Olesinski's and Corentin Labbe's, carried verbatim from
# the linux-rockchip series "crypto: rockchip: Add RK356x/RK3588 cryptographic
# offloader" at its v3 posting, which is NOT merged.
#
# CRYPTO_DEV_ROCKCHIP2 is a tristate with no default, so without a kconfig fragment
# setting it the DT nodes 102 and 103 add describe a device that nothing binds to --
# no build error, no boot message. That symbol is the consumer's to set, as
# CONFIG_VSI_IOMMU is above: this collection carries no defconfig hunk for either, and
# no kconfig at all. The arm64 defconfig moves every release -- 7.2 dropped
# CRYPTO_DEV_XILINX_TRNG from the very lines such a hunk anchors on -- so a patch
# against it is the least durable way to carry a build decision, and it fails by
# needing a rebase at exactly the moment a kernel bump has the least attention to
# spare.
#
# The RK3588 binds through the rockchip,rk3568-crypto fallback compatible, which is
# why the driver's match table carries only the one entry; the SCMI clock and reset
# ids the node uses (SCMI_CRYPTO_CORE, SCMI_ACLK/HCLK_SECURE_NS, SCMI_SRST_CRYPTO_CORE)
# are all in the mainline dt-bindings headers, and rk3588-base.dtsi already reaches
# scmi_reset the same way its rng node does. 102 touches rk356x-base.dtsi, which no
# board here builds against; it is carried because the series is developed and tested
# as a unit and dropping a patch from the middle makes the next re-sync harder, not
# because we need it.
#
# Two things to know before trusting it. The nodes carry no `status`, so the block is
# enabled by default on every RK356x and RK3588 board built from these dtsi files --
# the clocks are the non-secure instance (SECURE_NS), but whether a given board's
# firmware also drives that block is not something this series establishes. And v3 is
# under review: the reset-names schema admits three names where both in-tree users
# list exactly one, the per-SG IV update in rk2_cipher_run() indexes the destination
# with a length taken from the source (safe only because rk2_cipher_need_fallback()
# rejects a source/destination chunk mismatch, which nothing at the use site says),
# and dma_free_coherent()/kfree() in .remove run before devres frees the IRQ. None of
# those is a reason to hold the series out of a build, and all of them are a reason to
# expect a v4 and to re-sync rather than to carry these files forever.
kernel = [
    "media-accel/kernel/030-v4l2-mem2mem-parallel-jobs.patch",
    "media-accel/kernel/041-rkvdec-rcb-correct-size.patch",
    "media-accel/kernel/042-rkvdec-remove-unused-need-reset.patch",
    "media-accel/kernel/043-v4l2-export-max-parallel-jobs.patch",
    "media-accel/kernel/044-rkvdec-split-core-and-master.patch",
    "media-accel/kernel/045-rkvdec-multicore.patch",
    { path = "media-accel/kernel/050-av1-iommu-v14-curated.patch", kernels = "<7.2" },
    "media-accel/kernel/060-vepu580-rcawston-v3.patch",
    "media-accel/kernel/070-rga-multicore-vendor-oot.patch",
    "media-accel/kernel/071-rga-multicore-fixups.patch",
    { path = "media-accel/kernel/072-rk3588-rga-dts-7.1.patch", kernels = "<7.2" },
    { path = "media-accel/kernel/072-rk3588-rga-dts-7.2.patch", kernels = ">=7.2" },
    "media-accel/kernel/073-rkvdec-hevc-bound-tile-counts.patch",
    "media-accel/kernel/074-rkvdec-av1-bound-tile-counts.patch",
    "media-accel/kernel/075-hantro-fix-run-fail-cleanup.patch",
    "rocket/081-rocket-drv-npu-clk.patch",
    "rocket/082-rocket-drv-npu-volt.patch",
    "rocket/083-rocket-drv-iommu-keepattach.patch",
    "rocket/084-rocket-drv-fix-bo-mm-uaf.patch",
    "rocket/085-rocket-drv-uapi-extensible-structs.patch",
    "rocket/086-rocket-drv-batched-submit.patch",
    "rocket/087-rocket-drv-fix-task-array-double-free.patch",
    "rocket/088-rocket-drv-reset-before-iommu-detach.patch",
    "rocket/089-rocket-drv-clocks-by-name.patch",
    "rocket/090-rocket-drv-irq-under-job-lock.patch",
    "rocket/091-rocket-drv-irq-sync-before-reset.patch",
    "crypto/kernel/100-dt-bindings-crypto-rockchip-rk356x-rk3588-engine.patch",
    "crypto/kernel/101-crypto-rockchip-rk356x-rk3588-offloader.patch",
    "crypto/kernel/102-arm64-dts-rockchip-rk356x-crypto-node.patch",
    "crypto/kernel/103-arm64-dts-rockchip-rk3588-crypto-node.patch",
]

# ffmpeg tree (Kwiboo v4l2-request base + nyanmisaka rkmpp/rkrga graft): the graft
# materialized as an ordered `git am` series (0001-0004; one commit needs a 3-way
# resolution a cherry-pick cannot reproduce — see media-accel/ffmpeg/README.md),
# then the NV15/NV20 fix that scale_rkrga expects (0005).
#
# 0006 belongs to the base, not the graft: it teaches hwcontext_vulkan's DRM
# importer the composed one-layer/N-plane descriptor that hwcontext_v4l2request
# emits, which the importer rejects today for plain 8-bit NV12 against every
# Vulkan driver. It shares no file with 0001-0005, and when the RK3576 series
# gains an ffmpeg scope it wants this same patch: nothing in it is RK3588-specific.
#
# 0007-0013 are defect fixes in the grafted code, so each one follows the patch
# that introduces the file it touches: 0007/0008 need 0004's rkrga filters,
# 0010-0012 need 0003's RKMPP hwcontext, and 0013 needs 0002's swscale converter.
# 0009 is the exception — `rkmppenc.c` comes from the base — but it is grouped
# here because it only compiles under `--enable-rkmpp`, which is the graft's
# configure surface.
#
# The two that matter are 0007 and 0009. 0007 is a use-after-free followed by a
# double free: both RGA async delivery paths called `av_frame_free()` on a frame
# `ff_filter_frame()` had already taken and freed, which its own contract in
# `libavfilter/filters.h` says it does on every error return. 0009 is the
# encoder's DRM import reading `layers[0]`, `planes[0..1]` and `objects[0]` with
# no count checks, dividing by a stride it never checks for zero, and silently
# importing object 0 for a frame whose planes live elsewhere.
#
# None of the seven has run on hardware. They compile warning-clean and the
# series reproduces byte-for-byte, which is not the same thing.
ffmpeg = [
    "media-accel/ffmpeg/0001-lavu-add-NV15-and-NV20-bitstream-formats-support.patch",
    "media-accel/ffmpeg/0002-lsws-add-NV15-and-NV20-formats-support.patch",
    "media-accel/ffmpeg/0003-lavu-add-RKMPP-hwcontext.patch",
    "media-accel/ffmpeg/0004-lavf-rkrga-add-RKRGA-scale-vpp-and-overlay-filters.patch",
    "media-accel/ffmpeg/0005-rkrga-accept-v4l2request-10bit-nv15-nv20.patch",
    "media-accel/ffmpeg/0006-hwcontext-vulkan-import-multiplanar-drm-frames.patch",
    "media-accel/ffmpeg/0007-rkrga-do-not-free-frame-owned-by-ff-filter-frame.patch",
    "media-accel/ffmpeg/0008-rkrga-clear-output-frame-crop-rectangle.patch",
    "media-accel/ffmpeg/0009-rkmppenc-validate-drm-descriptor-before-import.patch",
    "media-accel/ffmpeg/0010-hwcontext-rkmpp-free-mapping-on-non-linear-reject.patch",
    "media-accel/ffmpeg/0011-hwcontext-rkmpp-honour-device-level-cacheable-flags.patch",
    "media-accel/ffmpeg/0012-hwcontext-rkmpp-pool-buffer-size-in-size-t.patch",
    "media-accel/ffmpeg/0013-lsws-nv15-nv20-do-not-drop-row-tail-samples.patch",
]

# Userspace tree (librockchip-mpp): force MPP allocations onto the contiguous
# default_cma_region heap so VEPU580 encode works against the mainline kernel, and
# mark every heap entry cacheable, because that heap's mapping is. An entry left
# claiming MPP_ALLOC_FLAG_NONE is a false statement about the memory: MPP skips
# DMA_BUF_IOCTL_SYNC for it, and the encoder's own stream buffer -- CPU-written
# parameter sets and SEI, VPU-written slice data, one buffer -- never becomes
# coherent. That produces a packet of the right length whose every IDR has garbage
# where the slice start code belongs, which is a defect no encode test catches
# unless it decodes its own output.
userspace = [
    "media-accel/userspace/001-mpp-allocator-dma-heap-mainline-cma.patch",
]

# u-boot tree: empty, because u-boot is its own axis. This series is the RK3588
# kernel/ffmpeg/userspace accel stack; a board that wants more than mainline u-boot
# selects a u-boot series of its own (the RK1's are turing-rk1-recovery and
# turing-rk1-util, from the rk3588 scope).
uboot = []
