# ffmpeg tree (Kwiboo v4l2-request base + nyanmisaka rkmpp/rkrga graft): the graft
# materialized as an ordered `git am` series (0001-0004; one commit needs a 3-way
# resolution a cherry-pick cannot reproduce — see media-accel/ffmpeg/README.md),
# then the NV15/NV20 tag fix the base needs (0005).
#
# 0005 is what makes 10-bit hardware decode usable at all beyond the RGA filters.
# The base tags a packed NV15 capture buffer with the planar logical sw_format
# YUV420P10, which describes neither its plane count nor its sample layout, and it
# then has to switch off everything generic that would act on that tag:
# transfer_get_formats() blanks its whole format list for YUV420P/YUV420P10/
# YUV422P10 and map_from() returns ENOSYS for the same three. So hwdownload of a
# 10-bit frame fails for every target format and hwmap fails outright -- which is
# why HDR has to fall back to software decode to reach a tone mapper, at 26x the CPU
# for a twelfth of the throughput. 0001 already adds AV_PIX_FMT_NV15/NV20 and 0002
# already teaches swscale to read them, so the fix is to tag the two table entries
# honestly and let the machinery work: hwdownload yields a real NV15 frame, hwmap
# maps the dma-buf with no copy, and `format=yuv420p10le` unpacks. The guards stay
# as they are, because the tiled and AFBC entries genuinely do carry a logical tag
# that lies about their layout and must keep failing.
#
# It replaces a patch that normalised the same two tags back to NV15/NV20 inside the
# RGA filters. That was the same fix applied one consumer at a time; the RGA filters
# map AV_PIX_FMT_NV15 natively, so with the tag right they need nothing.
#
# 0006 belongs to the base, not the graft: it teaches hwcontext_vulkan's DRM
# importer the composed one-layer/N-plane descriptor that hwcontext_v4l2request
# emits, which the importer rejects today for plain 8-bit NV12 against every
# Vulkan driver. It shares no file with 0001-0005, and when the RK3576 series
# gains an ffmpeg scope it wants this same patch: nothing in it is RK3588-specific.
#
# 0007-0013 are defect fixes in the grafted code, so each one follows the patch
# that introduces the file it touches: 0007/0008 need 0004's rkrga filters,
# 0010-0012 need 0003's RKMPP hwcontext, and 0013 needs 0002's swscale converter.
# 0009 is the exception — `rkmppenc.c` comes from the base — but it is grouped
# here because it only compiles under `--enable-rkmpp`, which is the graft's
# configure surface.
#
# The two that matter are 0007 and 0009. 0007 is a use-after-free followed by a
# double free: both RGA async delivery paths called `av_frame_free()` on a frame
# `ff_filter_frame()` had already taken and freed, which its own contract in
# `libavfilter/filters.h` says it does on every error return. 0009 is the
# encoder's DRM import reading `layers[0]`, `planes[0..1]` and `objects[0]` with
# no count checks, dividing by a stride it never checks for zero, and silently
# importing object 0 for a frame whose planes live elsewhere.
#
# None of the seven has run on hardware. They compile warning-clean and the
# series reproduces byte-for-byte, which is not the same thing.
#
# 0014 and 0015 belong to the base as 0006 does, and build the subtitle branch
# every hardware burn-in chain needs: a transparent frame with libass drawn into
# it, for a compositor to lay over the video. Neither is RK3588-specific and
# neither shares a file with the graft.
#
# 0014's `alphasrc` supplies the transparent base, which `color` cannot --
# `ff_draw_init` leaves the alpha component alone unless the caller asks for it
# and `vsrc_color` does not, so `color=c=black@0` emits opaque black. It is also
# the name Jellyfin probes to decide whether any hardware filter chain is
# available, falling back to software filtering when it is absent.
#
# 0015's `sub2video` makes that branch's alpha correct. Unpatched, drawing onto a
# transparent base gets it wrong twice: `ff_blend_mask` weights every component
# including alpha by the event's own alpha, so the alpha plane receives a*a, and
# the colour lands premultiplied where a straight-alpha overlay expects it not to
# be. Measured against CPU burn-in that is 34.7 dB for semi-transparent subtitles
# where opaque ones reach 82.4. `AVALPHA_MODE_PREMULTIPLIED` does not substitute:
# `ff_draw_color` premultiplies only the colour and leaves alpha straight.
#
# 0015 is the only patch in this list that touches shared code -- `drawutils` also
# backs drawtext, drawbox and the pad/fill filters -- but its additions are gated
# on new flags no other caller sets.
#
# 0016 makes SPS-level RPS streams decode correctly. The VDPU381/383 hardware
# parses slice headers itself, so a slice that selects its short or long term
# RPS from the SPS by index needs the SPS tables in the driver -- the Linux 7.2
# EXT_SPS_ST_RPS / EXT_SPS_LT_RPS controls, which the base never sends. Without
# them the driver programs no RPS table (it warns "Long and short term RPS not
# set") and every inter frame of such a stream reconstructs against the wrong
# references while decoding reports success. Encoders split on where they put
# the RPS: x265 writes the inline slice-header form the hardware parses itself,
# HM writes SPS-level sets -- which is why the gap is invisible on typical
# encoder output and dominates conformance scoring (JCT-VC-HEVC_V1 runs 15/147
# without the controls). Short term sets are sent in the explicit form: the
# driver only derives per-set delta POCs and used flags, which the explicit
# syntax encodes exactly. Both controls are probed like the other optional
# controls, so drivers without the uAPI are untouched.
#
# 0017-0019 reach the VEPU121 JPEG encoder, a mainline V4L2 stateful M2M device
# that ffmpeg had no wrapper for in either direction -- which is what kept every
# consumer driving ffmpeg (Jellyfin trickplay, Frigate snapshots) on a software
# JPEG encode beside idle silicon. They speak only the kernel uAPI and touch no
# vendor library, so unlike 0001-0004 they are upstreamable as they stand.
#
# 0017 and 0018 are generic V4L2 M2M fixes that JPEG is simply the first codec
# here to need, and both were found by measuring the driver rather than reading.
# 0017: the stateful encoder interface has the client set the coded format on
# CAPTURE first, because a driver derives its raw format from the coded one and
# may reset the raw queue when the coded one is set -- which hantro does, in
# hantro_set_fmt_cap() -> hantro_reset_raw_fmt(). ffmpeg set them the other way
# round, so asking for NM12 left the hardware in YM12 while ffmpeg's cached
# v4l2_format still said NM12: no error, wrong chroma. 0018: AV_CODEC_ID_MJPEG
# maps to both V4L2_PIX_FMT_MJPEG and V4L2_PIX_FMT_JPEG and only the first was
# ever tried, while this driver enumerates only the second -- and separately, a
# TRY_FMT that succeeds is not agreement, because a driver that cannot do the
# requested fourcc must substitute one it can and still return 0 (asking this
# device for NV12 on a multiplanar queue yields YM12, not NM12).
#
# 0019 is the encoder. JPEG shares none of the inter-coded setup, and its one
# control lives in the JPEG control class, which the MPEG class the code
# hardcoded is refused for with EINVAL. Three further things it needs: the
# OUTPUT crop rectangle, which is what V4L2 calls the visible part of a
# macroblock-aligned buffer and what hantro reads as the JPEG's own dimensions
# (without it 1080 lines are coded as 1088); a capture buffer the driver sizes,
# since ffmpeg's half-a-raw-frame estimate is an inter-coded assumption that an
# intra-only JPEG can exceed; and a keyframe flag on every packet, which this
# driver does not set and without which no packet in an .mjpeg is seekable.
ffmpeg = [
    "media-accel/ffmpeg/0001-lavu-add-NV15-and-NV20-bitstream-formats-support.patch",
    "media-accel/ffmpeg/0002-lsws-add-NV15-and-NV20-formats-support.patch",
    "media-accel/ffmpeg/0003-lavu-add-RKMPP-hwcontext.patch",
    "media-accel/ffmpeg/0004-lavf-rkrga-add-RKRGA-scale-vpp-and-overlay-filters.patch",
    "media-accel/ffmpeg/0005-hwcontext-v4l2request-tag-nv15-nv20-as-themselves.patch",
    "media-accel/ffmpeg/0006-hwcontext-vulkan-import-multiplanar-drm-frames.patch",
    "media-accel/ffmpeg/0007-rkrga-do-not-free-frame-owned-by-ff-filter-frame.patch",
    "media-accel/ffmpeg/0008-rkrga-clear-output-frame-crop-rectangle.patch",
    "media-accel/ffmpeg/0009-rkmppenc-validate-drm-descriptor-before-import.patch",
    "media-accel/ffmpeg/0010-hwcontext-rkmpp-free-mapping-on-non-linear-reject.patch",
    "media-accel/ffmpeg/0011-hwcontext-rkmpp-honour-device-level-cacheable-flags.patch",
    "media-accel/ffmpeg/0012-hwcontext-rkmpp-pool-buffer-size-in-size-t.patch",
    "media-accel/ffmpeg/0013-lsws-nv15-nv20-do-not-drop-row-tail-samples.patch",
    "media-accel/ffmpeg/0014-lavfi-add-alphasrc-source-video-filter.patch",
    "media-accel/ffmpeg/0015-lavfi-subtitles-add-sub2video-option.patch",
    "media-accel/ffmpeg/0016-v4l2request-hevc-set-sps-rps-controls.patch",
    "media-accel/ffmpeg/0017-v4l2m2m-set-coded-format-before-raw-when-encoding.patch",
    "media-accel/ffmpeg/0018-v4l2m2m-negotiate-formats-the-driver-offers.patch",
    "media-accel/ffmpeg/0019-v4l2m2m-add-mjpeg-encoder.patch",
]

# Userspace tree (librockchip-mpp): force MPP allocations onto the contiguous
# default_cma_region heap so VEPU580 encode works against the mainline kernel, and
# mark every heap entry cacheable, because that heap's mapping is. An entry left
# claiming MPP_ALLOC_FLAG_NONE is a false statement about the memory: MPP skips
# DMA_BUF_IOCTL_SYNC for it, and the encoder's own stream buffer -- CPU-written
# parameter sets and SEI, VPU-written slice data, one buffer -- never becomes
# coherent. That produces a packet of the right length whose every IDR has garbage
# where the slice start code belongs, which is a defect no encode test catches
# unless it decodes its own output.
userspace = [
    "media-accel/userspace/001-mpp-allocator-dma-heap-mainline-cma.patch",
]

# u-boot tree: empty, because u-boot is its own axis. This series is the RK3588
# kernel/ffmpeg/userspace accel stack; a board that wants more than mainline u-boot
# selects a u-boot series of its own (the RK1's are turing-rk1-recovery and
# turing-rk1-util, from the rk3588 scope).
uboot = []
